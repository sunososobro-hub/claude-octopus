name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"   # weekly full-history scan

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Leak check (tracked files)
        run: python scripts/leak_check.py --allow scripts/leak_allowlist.txt $(git ls-files)

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned)
        run: |
          curl -sSfL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks version
      - name: Scan full history
        run: ./gitleaks detect --source . --config .gitleaks.toml --redact --verbose --no-banner
