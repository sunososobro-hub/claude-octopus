# .agent/project.yml - Thriae pipeline config (schema: hive/pipeline/project.template.yml in sunososobro-hub/thriae).
# Generated by onboard.sh. Protected path (Strong review PASS). Tune areas, budgets and protected_paths.

repo: sunososobro-hub/claude-octopus
public: true
keeper_account: sunososobro-hub
reviewer_account: ""              # single-account setup: the run that opened a PR never reviews it
collaborators: []
core_version: thriae-main         # vendored by thriae-sync.yml from sunososobro-hub/thriae's default branch

dev_branch: master              # one lane: PRs merge into the default branch
main_branch: master
release_lane: none

verify:
  test: "python -m unittest discover -s tests"
  lint: ""
ci:
  test_job: test
  workflow: ci.yml
  runner: ubuntu-latest
  setup: ""

areas:
  - scripts
  - commands
  - hooks
  - tests
  - ci
  - docs
dimension_labels: []

protected_paths:
  - ".github/workflows/**"
  - "AGENTS.md"
  - "CLAUDE.md"
  - ".agent/core/**"
  - ".agent/project.yml"
  - "hooks/**"
  - ".claude-plugin/**"
  - "scripts/**"
  - "hive/pipeline/roles/**"

throttle_issue: 4                 # filled in by onboard.sh
ledger_issue: 5
usage_line_prefix: "claude-octopus-usage"

budget_targets:
  bug: 30
  enhancement: 30
  eval: 5
  documentation: 10
  maint: 10
  qa: 10
  idea: 5
infra_cap_pct: 10
max_doing: 3
orphan_timeout_min:
  light: 20
  strong: 45

model_strong_domains:
  - security-sensitive code

git_identity:
  name: sunososobro-hub
  email: 243713070+sunososobro-hub@users.noreply.github.com
